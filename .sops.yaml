---
# sops creation rules for Hermes-ACC.
# Replace the age public key placeholders with real keys before use.
# Two recipients: primary operator + offline recovery identity.
# See secrets/README-age-key-bootstrap.md for setup instructions.
creation_rules:
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: '^(.*_KEY|.*_TOKEN|.*_PASSWORD|.*_SECRET|.*_B64|data)$'
    age: >-
      age1wm97dzvzx4aswpwdjvjyqsggxdvhjsxclvwa2km8yhs9kjrkxghqs243cn,
      age1REPLACE_WITH_OFFLINE_RECOVERY_PUBLIC_KEY
