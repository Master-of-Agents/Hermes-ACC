---
schema_version: "1.0"
# Provider account metadata. No passwords, no tokens — references only.
provider_accounts:
  - id: hostinger
    name: Hostinger
    account_ref: "REPLACE_WITH_ACCOUNT_EMAIL_OR_ID"
    billing_ref: "REPLACE_WITH_BILLING_REFERENCE"
    mfa_enabled: true
    services:
      - VPS srv1663264
    notes: "Primary VPS provider. Console access via Hostinger web panel."
    owner: primary-admin
    status: active

  - id: telegram
    name: Telegram / BotFather
    account_ref: "REPLACE_WITH_TELEGRAM_ACCOUNT"
    billing_ref: null
    mfa_enabled: false
    services:
      - "Hermes bot (TELEGRAM_BOT_TOKEN)"
    notes: "Bot managed via @BotFather. Home channel: 8615165545."
    owner: primary-admin
    status: active

  - id: openrouter
    name: OpenRouter
    account_ref: null
    billing_ref: null
    mfa_enabled: null
    services: []
    notes: >
      No account. Not required for MVP. Current LLM access is via Anthropic API directly.
      Operator uses OpenAI / ChatGPT (subscription) for personal use; no API key in use.
      Add OpenRouter if multi-provider routing is needed in a future phase.
    owner: primary-admin
    status: not_configured

  - id: anthropic
    name: Anthropic
    account_ref: "REPLACE_WITH_ANTHROPIC_ACCOUNT_EMAIL"
    billing_ref: null
    mfa_enabled: true
    services:
      - "Claude subscription (claude.ai) — operator personal use"
    notes: >
      Operator uses Claude via subscription, not the API.
      No ANTHROPIC_API_KEY exists for the Hermes agent container.
      Create an API key at console.anthropic.com when agent autonomous LLM access is needed.
    owner: primary-admin
    status: active

  - id: github
    name: GitHub / Master-of-Agents
    account_ref: "Master-of-Agents"
    billing_ref: null
    mfa_enabled: true
    services:
      - "Hermes-ACC repository"
      - "hermes-agents repository"
    notes: "Private org. Deploy keys per repo. No shared PATs on VPS."
    owner: primary-admin
    status: active
