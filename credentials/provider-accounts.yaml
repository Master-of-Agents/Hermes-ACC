---
schema_version: "1.0"
# Provider account metadata. No passwords, no tokens — references only.
provider_accounts:
  - id: hostinger
    name: Hostinger
    account_ref: "REPLACE_WITH_ACCOUNT_EMAIL_OR_ID"
    billing_ref: "REPLACE_WITH_BILLING_REFERENCE"
    mfa_enabled: true
    services:
      - VPS srv1663264
    notes: "Primary VPS provider. Console access via Hostinger web panel."
    owner: primary-admin
    status: active

  - id: telegram
    name: Telegram / BotFather
    account_ref: "REPLACE_WITH_TELEGRAM_ACCOUNT"
    billing_ref: null
    mfa_enabled: false
    services:
      - "Hermes bot (TELEGRAM_BOT_TOKEN)"
    notes: "Bot managed via @BotFather. Home channel: 8615165545."
    owner: primary-admin
    status: active

  - id: openrouter
    name: OpenRouter
    account_ref: "REPLACE_WITH_OPENROUTER_ACCOUNT_EMAIL"
    billing_ref: "REPLACE_WITH_BILLING_REFERENCE"
    mfa_enabled: true
    services:
      - "LLM routing for Hermes agent"
    notes: "API key tracked in credential-registry.yaml as OPENROUTER_API_KEY."
    owner: primary-admin
    status: active

  - id: anthropic
    name: Anthropic
    account_ref: "REPLACE_WITH_ANTHROPIC_ACCOUNT_EMAIL"
    billing_ref: "REPLACE_WITH_BILLING_REFERENCE"
    mfa_enabled: true
    services:
      - "Direct Claude API for Hermes agent"
    notes: "API key tracked as ANTHROPIC_API_KEY."
    owner: primary-admin
    status: active

  - id: github
    name: GitHub / Master-of-Agents
    account_ref: "Master-of-Agents"
    billing_ref: null
    mfa_enabled: true
    services:
      - "Hermes-ACC repository"
      - "hermes-agents repository"
    notes: "Private org. Deploy keys per repo. No shared PATs on VPS."
    owner: primary-admin
    status: active
