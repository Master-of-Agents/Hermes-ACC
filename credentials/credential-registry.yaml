---
schema_version: "1.0"
# Credential registry — metadata ONLY. No raw secrets here.
# Raw values live in secrets/hermes.env.enc.yaml (sops-encrypted).
# Update last_rotated after every rotation.
credentials:
  - name: TELEGRAM_BOT_TOKEN
    provider: telegram
    purpose: "Auth for the Hermes Telegram bot gateway"
    required_by:
      containers: [hermes-agent]
      scripts: [deploy-hermes.sh, healthcheck.sh]
      agents: [hermes-founding-agent]
    storage_location: "secrets/hermes.env.enc.yaml :: TELEGRAM_BOT_TOKEN"
    encrypted_secret_ref: "sops:secrets/hermes.env.enc.yaml#TELEGRAM_BOT_TOKEN"
    runtime_destination: "/run/hermes/.env (rendered, tmpfs preferred)"
    rotation_frequency_days: 180
    last_rotated: "2026-05-14"
    bot_display_name: "Atlatus"
    bot_username: "@uet_atlatus_bot"
    recovery_notes: "Recreate bot via @BotFather (display: Atlatus, username: @uet_atlatus_bot). Update home chat ID if new bot created."
    owner: primary-admin
    blast_radius: "Telegram gateway only; no LLM access."
    dependencies:
      - "TELEGRAM_HOME_CHAT_ID (config value, not secret — hardcoded: 8615165545)"
    revocation_procedure: "@BotFather → /revoke → rotate in sops file → redeploy."
    status: active

  - name: OPENROUTER_API_KEY
    provider: openrouter
    purpose: "LLM routing via OpenRouter — optional, not configured for MVP"
    required_by:
      containers: []
      agents: []
    storage_location: "Not stored — no account configured"
    encrypted_secret_ref: null
    runtime_destination: "/run/hermes/.env (omit if not configured)"
    rotation_frequency_days: 90
    last_rotated: null
    recovery_notes: "Create account at openrouter.ai; generate API key; add to sops file."
    owner: primary-admin
    blast_radius: "LLM spend up to account quota; abuse rate-limited per provider."
    dependencies: []
    revocation_procedure: "Revoke in OpenRouter dashboard; remove from sops file; redeploy."
    notes: >
      Not required for MVP. No OpenRouter account. Add if multi-provider routing
      is needed in a future phase.
    status: not_configured

  - name: ANTHROPIC_API_KEY
    provider: anthropic
    purpose: "Direct Anthropic Claude API access for Hermes agent container"
    required_by:
      containers: []
      agents: []
    storage_location: "Not stored — no API key, operator uses Claude subscription"
    encrypted_secret_ref: null
    runtime_destination: "/run/hermes/.env (omit if not configured)"
    rotation_frequency_days: 90
    last_rotated: null
    recovery_notes: "console.anthropic.com → API keys → create new key if API access is needed."
    owner: primary-admin
    blast_radius: "Anthropic spend up to account quota."
    dependencies: []
    revocation_procedure: "Revoke in Anthropic console; remove from sops file; redeploy."
    notes: >
      Operator uses Claude via subscription (claude.ai), not the API.
      No API key exists or is needed for MVP operator tooling.
      Required when the Hermes agent container needs to make LLM calls autonomously —
      add an API key (Anthropic or another provider) before activating the agent.
    status: not_configured

  - name: GITHUB_INTEGRATION
    provider: github
    purpose: "Read-only deploy key for hermesctl@VPS to clone/pull Master-of-Agents/Hermes-ACC"
    required_by:
      scripts: [bootstrap-vps.sh, deploy-hermes.sh]
      agents: [hermes-founding-agent, claude-code]
    storage_location: "SSH deploy key on VPS at /home/hermesctl/.ssh/id_ed25519_hermes_acc"
    encrypted_secret_ref: "sops:secrets/hermes.env.enc.yaml#GITHUB_DEPLOY_KEY_B64"
    runtime_destination: "/home/hermesctl/.ssh/id_ed25519_hermes_acc (chmod 0600)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-13"
    fingerprint: "SHA256:1G2orYJBMubVYfc/aHPEpbN0e8d4OzVLe0QvIJQ7aIU"
    recovery_notes: "Generate new ed25519 key. Add public key as repo deploy key. Remove old."
    owner: primary-admin
    blast_radius: "Hermes-ACC repo read-only. hermes-agents needs a separate deploy key."
    dependencies: []
    revocation_procedure: "GitHub → repo Settings → Deploy keys → delete old key."
    status: active

  - name: GITHUB_STATE_BACKUP_KEY_ATLATUS
    provider: github
    purpose: "Write-enabled deploy key — pushes hourly agent-state snapshots to Master-of-Agents/hermes-state-atlatus"
    required_by:
      scripts: [backup-agent-state.sh, install-backup-timer.sh]
      systemd_units: [hermes-backup-atlatus.service, hermes-backup-atlatus.timer]
    storage_location: "/home/hermesctl/.ssh/id_ed25519_hermes_state_atlatus (on srv1663264 only)"
    encrypted_secret_ref: null  # not in sops — VPS-local only, regenerable
    runtime_destination: "/home/hermesctl/.ssh/id_ed25519_hermes_state_atlatus (chmod 0600)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-14"
    fingerprint: "SHA256:DMZFi4qmvqAnvECkrB+8BeFwk03TZzSnjJ+bu8/6qjw"
    recovery_notes: |
      Regenerate from scratch in the new-vps-from-zero runbook Phase 5.5.
      The private half is intentionally NOT in sops — each agent VPS owns
      its own write key, so loss of one VPS can't be used to forge backups
      from another agent.
    owner: primary-admin
    blast_radius: |
      Write access to Master-of-Agents/hermes-state-atlatus only.
      Cannot push to Hermes-ACC or any other agent's state repo.
    dependencies: []
    revocation_procedure: "GitHub → hermes-state-atlatus → Settings → Deploy keys → delete; generate a new key, re-run install-backup-timer.sh."
    status: active

  - name: VPS_SSH_LOGIN_KEY
    provider: hostinger
    purpose: "SSH access to hermesctl@VPS_HOST (operator workstation key)"
    required_by:
      humans: [primary-admin]
    storage_location: "Operator workstation ~/.ssh/id_ed25519_hermes_vps (NOT in repo)"
    encrypted_secret_ref: null
    runtime_destination: "~/.ssh/id_ed25519_hermes_vps (chmod 0600)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-14"
    fingerprint: "SHA256:eg8DLsLPs6wsi5rTUUCSFcdv92zpfPWSLVYrN2gOGho"
    recovery_notes: "Hostinger console → SSH keys → upload new public key; remove old from authorized_keys."
    owner: primary-admin
    blast_radius: "Full VPS access via hermesctl (passwordless sudo in MVP)."
    dependencies: []
    revocation_procedure: "Remove from /home/hermesctl/.ssh/authorized_keys via Hostinger console or root."
    status: active

  - name: AGE_RECIPIENT_PUBLIC_KEY_PRIMARY
    provider: self
    purpose: "Public half of the primary age key pair — used to encrypt sops secrets"
    required_by:
      scripts: [render-env-from-sops.sh, backup-hermes.sh]
      secrets: ["secrets/hermes.env.enc.yaml"]
    storage_location: ".sops.yaml (creation_rules) — public key, safe to commit"
    encrypted_secret_ref: null
    runtime_destination: "n/a (used at encryption time only)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-13"
    public_key: "age1wm97dzvzx4aswpwdjvjyqsggxdvhjsxclvwa2km8yhs9kjrkxghqs243cn"
    recovery_notes: "Public key; safe to share."
    owner: primary-admin
    blast_radius: "None on its own — public key only."
    dependencies: []
    revocation_procedure: "Remove from .sops.yaml; run sops updatekeys on every *.enc.yaml."
    status: active

  - name: AGE_RECIPIENT_PUBLIC_KEY_RECOVERY
    provider: self
    purpose: "Public half of the offline recovery age key — fallback decryption if primary key is lost"
    required_by:
      secrets: ["secrets/hermes.env.enc.yaml"]
    storage_location: ".sops.yaml (creation_rules) — public key, safe to commit"
    encrypted_secret_ref: null
    runtime_destination: "n/a (used at encryption time only)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-14"
    public_key: "age1dqtxqn44crj9uhzyy8xvsdc7ug6x78jwxdw56l0ry7sua3zd03rsqx5s8n"
    recovery_notes: |
      Private key generated 2026-05-14 on VPS, immediately saved to Bitwarden.
      Private key must NOT remain on the VPS after backup — delete /tmp/recovery.txt.
      If primary key is lost, load this private key and run sops decrypt.
    owner: primary-admin
    blast_radius: "Decrypts all sops secrets — treat private half as critically sensitive."
    dependencies: []
    revocation_procedure: "Remove from .sops.yaml; run sops updatekeys (requires primary or another recovery identity)."
    status: active

  - name: AGE_IDENTITY_PRIVATE_PRIMARY
    provider: self
    purpose: "Private half of the primary age key — decrypts all sops secrets"
    required_by:
      scripts: [render-env-from-sops.sh, restore-hermes.sh]
    storage_location: |
      OUT OF REPO — NEVER commit this.
      Workstation: C:\Users\ue\.config\sops\age\keys.txt (chmod 0600)
      Offline backup: Bitwarden (backed up 2026-05-13)
      VPS: /home/hermesctl/.config/sops/age/keys.txt (chmod 0600) — copied 2026-05-14
    encrypted_secret_ref: null
    runtime_destination: "SOPS_AGE_KEY_FILE env var or default sops path (~/.config/sops/age/keys.txt)"
    rotation_frequency_days: 365
    last_rotated: "2026-05-13"
    recovery_notes: |
      CRITICAL: Must be backed up offline (password manager + hardware/paper copy).
      If lost AND no recovery identity is configured, ALL sops secrets become
      permanently unrecoverable. See runbooks/lost-age-key.md.
    owner: primary-admin
    blast_radius: "Decrypts EVERY sops-encrypted secret in this repository."
    dependencies: []
    revocation_procedure: |
      1. Remove its public key from secrets/.sops.yaml.
      2. sops updatekeys on every *.enc.yaml (requires the recovery identity).
      3. Rotate every downstream credential — treat all as potentially exposed.
    status: active
