---
# Hermes-ACC pre-commit configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Docs: https://pre-commit.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint]
        exclude: ^secrets/hermes\.env\.enc\.yaml$

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: schema-version-required
        name: All YAML files must include schema_version
        entry: bash scripts/validate-repo.sh schema-version
        language: system
        types: [yaml]
        exclude: ^(\.yamllint|\.pre-commit-config\.yaml|secrets/\.sops\.yaml|docker/docker-compose|templates/)

      - id: forbidden-paths
        name: Forbid known-bad paths and filenames
        entry: bash scripts/validate-repo.sh forbidden-paths
        language: system
        pass_filenames: false

      - id: json-schema-validate
        name: Validate YAML files against JSON schemas
        entry: bash scripts/validate-repo.sh schema-validate
        language: system
        pass_filenames: false
