---
# Atlatus — production Docker Compose file
# Environment variables are injected from /run/atlatus/.env (sops-rendered, tmpfs).
# Generate it with: bash scripts/render-env-from-sops.sh atlatus /run/atlatus/.env
#
# Naming follows docs/naming-conventions.md.
# Inventory: inventory/containers.yaml → id: atlatus

services:
  atlatus:
    image: ${ATLATUS_IMAGE:-ghcr.io/hostinger/hvps-hermes-agent:latest}
    container_name: ${ATLATUS_CONTAINER_NAME:-atlatus}
    restart: unless-stopped
    env_file:
      - /run/atlatus/.env
    ports:
      - "${ATLATUS_PORT_HOST:-32768}:${ATLATUS_PORT_CONTAINER:-4860}"
    volumes:
      - data-atlatus:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${ATLATUS_PORT_CONTAINER:-4860}' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  data-atlatus:
    name: data-atlatus
