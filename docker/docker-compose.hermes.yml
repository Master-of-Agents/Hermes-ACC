---
# Hermes agent — production Docker Compose file
# Environment variables are injected from /run/hermes/.env (sops-rendered, tmpfs).
# Generate it with: bash scripts/render-env-from-sops.sh /run/hermes/.env
#
# Current inventory: inventory/containers.yaml → id: hermes-agent
# Variable values: inventory/servers.yaml and inventory/ports.yaml

services:
  hermes-agent:
    image: ${HERMES_IMAGE:-ghcr.io/hostinger/hvps-hermes-agent:latest}
    container_name: ${HERMES_CONTAINER_NAME:-hermes-agent}
    restart: unless-stopped
    env_file:
      - /run/hermes/.env
    ports:
      - "${HERMES_PORT_HOST:-32768}:${HERMES_PORT_CONTAINER:-4860}"
    volumes:
      - hermes_data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/${HERMES_PORT_CONTAINER:-4860}' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hermes_data:
    name: hermes_data
